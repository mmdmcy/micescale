[workspace]
members = [
    "crates/micescale-core",
    "crates/micescale",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
micescale-core = { path = "crates/micescale-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
